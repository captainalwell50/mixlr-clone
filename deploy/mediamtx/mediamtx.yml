# Production MediaMTX — keep in sync with docker/mediamtx/mediamtx.yml.
# On Azure VM: set authHTTPAddress to https://<your-host>/api/mediamtx/auth
# and webrtcAdditionalHosts to your public DNS or IP.

logLevel: info

authMethod: http
authHTTPAddress: https://stream.example.org/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof
  # Public listen (HLS/WHEP) must never challenge Basic auth in the browser.
  # Publish/WHIP still goes through authHTTPAddress.
  - action: read
  - action: playback

# Internal RTSP for ffmpeg Opus→AAC sidecar (bound in-container only; do not publish :8554).
rtsp: true
rtspAddress: :8554
rtspEncryption: "no"

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: true
webrtcAdditionalHosts: ['stream.example.org']

hls: true
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins: ['*']
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 4s
hlsAlwaysRemux: true

rtmp: true
rtmpAddress: :1935
rtmpEncryption: false

pathDefaults:
  source: publisher
  overridePublisher: true
  # Server archive for desktop + crash safety. Laravel ignores short reconnect junk.
  record: true
  recordFormat: fmp4
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordPartDuration: 1s
  recordSegmentDuration: 4h
  recordDeleteAfter: 8760h

paths:
  '~^live/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$':
    source: publisher
    runOnReady: sh /hooks/run-ready.sh
    runOnReadyRestart: yes
    runOnNotReady: sh /hooks/run-not-ready.sh
    runOnRecordSegmentComplete: sh /hooks/run-record-segment-complete.sh
  '~^live/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/aac$':
    source: publisher
    record: false
