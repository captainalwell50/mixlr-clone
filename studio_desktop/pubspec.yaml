name: soundmix_studio
description: Sound Mix Live Studio — premium desktop broadcast console.
publish_to: 'none'
version: 2.0.8+10

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_webrtc: ^0.11.7
  provider: ^6.1.2
  google_fonts: ^8.0.0
  share_plus: ^10.1.2
  file_picker: ^8.1.2
  speech_to_text: ^7.0.0
  video_player: ^2.9.5
  url_launcher: ^6.3.1
  just_audio: ^0.9.46
  just_audio_windows: ^0.2.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/soundmix-icon-1024.png
    - assets/brand/soundmix-logo.png
