name: Build Windows Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio_desktop/**'
      - '.github/workflows/build-windows-studio.yml'
    branches: [project/mixlr-clone, main, master]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio_desktop

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=API_BASE=https://soundmix.live

      - name: Zip Release folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "Sound-Mix-Live-Studio-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sound-Mix-Live-Studio-Windows
          path: studio_desktop/Sound-Mix-Live-Studio-Windows.zip
          if-no-files-found: error
