name: Build Windows Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio_desktop/**'
      - '.github/workflows/build-windows-studio.yml'
    branches: [project/mixlr-clone, main, master]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio_desktop

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=API_BASE=https://soundmix.live

      - name: Bundle VC++ runtime and README
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $sys = Join-Path $env:SystemRoot "System32"
          $dlls = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "concrt140.dll",
            "vccorlib140.dll"
          )
          foreach ($name in $dlls) {
            $src = Join-Path $sys $name
            if (Test-Path $src) {
              Copy-Item $src $release -Force
            }
          }
          $d3d = Join-Path $sys "d3dcompiler_47.dll"
          if (Test-Path $d3d) {
            Copy-Item $d3d $release -Force
          }
          Copy-Item "windows\Run Studio.cmd" $release -Force
          @(
            "Sound Mix Live Studio for Windows (64-bit)",
            "",
            "This folder is packaged into a single installer .exe.",
            "Sign in with your soundmix.live account after install."
          ) | Set-Content -Path (Join-Path $release "README.txt") -Encoding utf8

      - name: Install Inno Setup
        working-directory: ${{ github.workspace }}
        run: choco install innosetup -y --no-progress

      - name: Compile single-file installer
        shell: pwsh
        run: |
          $verLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $ver = ($verLine -split ':', 2)[1].Trim().Split('+')[0]
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "windows\installer\studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item "dist\Sound-Mix-Live-Studio.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Sound-Mix-Live-Studio-Windows
          path: studio_desktop/dist/Sound-Mix-Live-Studio.exe
          if-no-files-found: error
