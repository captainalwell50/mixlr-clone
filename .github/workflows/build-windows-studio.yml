name: Build Windows Studio

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio_desktop/**'
      - '.github/workflows/build-windows-studio.yml'
    branches: [project/mixlr-clone, main, master]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio_desktop

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --dart-define=API_BASE=https://soundmix.live

      - name: Bundle VC++ runtime and README
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $sys = Join-Path $env:SystemRoot "System32"
          $dlls = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vcruntime140_threads.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_atomic_wait.dll",
            "msvcp140_codecvt_ids.dll",
            "concrt140.dll",
            "vccorlib140.dll"
          )
          foreach ($name in $dlls) {
            $src = Join-Path $sys $name
            if (Test-Path $src) {
              Copy-Item $src $release -Force
            }
          }
          $d3d = Join-Path $sys "d3dcompiler_47.dll"
          if (Test-Path $d3d) {
            Copy-Item $d3d $release -Force
          }
          Copy-Item "windows\Run Studio.cmd" $release -Force
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile (Join-Path $release "VC_redist.x64.exe")
          @(
            "Sound Mix Live Studio for Windows (64-bit)",
            "",
            "1. Unzip this entire folder onto this PC (Documents is fine).",
            "2. Right-click the zip first if needed: Properties → Unblock → Apply.",
            "3. Double-click ""Run Studio.cmd"" (not only soundmix_studio.exe).",
            "4. Sign in with your soundmix.live account",
            "",
            "If Windows reports a missing DLL (VCRUNTIME140.dll), run VC_redist.x64.exe",
            "from this folder, then open soundmix_studio.exe again.",
            "",
            "Copy the folder to the local disk first. Do not run it from a network share."
          ) | Set-Content -Path (Join-Path $release "README.txt") -Encoding utf8

      - name: Zip Release folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "Sound-Mix-Live-Studio-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sound-Mix-Live-Studio-Windows
          path: studio_desktop/Sound-Mix-Live-Studio-Windows.zip
          if-no-files-found: error
