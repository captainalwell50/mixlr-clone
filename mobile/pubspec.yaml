name: live_mix
description: Sound Mix Live — Listen + Studio for Android, macOS, and Windows.
publish_to: 'none'
version: 1.2.14+25

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_webrtc: ^1.2.0
  just_audio: ^0.9.40
  audio_session: ^0.1.25
  permission_handler: ^11.3.1
  provider: ^6.1.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  google_fonts: ^8.0.0
  share_plus: ^10.1.2
  flutter_svg: ^2.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+19
  image_picker_platform_interface: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/soundmix-mark.svg
    - assets/brand/soundmix-mark.png
    - assets/brand/soundmix-icon-1024.png
    - assets/brand/soundmix-logo.png

