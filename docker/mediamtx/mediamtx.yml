# Browser publish: POST SDP to http://<host>:8889/live/<uuid>/whip
# HLS playback:    http://<host>:8888/live/<uuid>/index.m3u8
# AAC HLS (CDN):   http://<host>:8888/live/<uuid>/aac/index.m3u8  (ffmpeg remux from WHIP Opus)
# Azure / NAT: set webrtcAdditionalHosts to your public hostname or VM IP.

logLevel: info

# External auth → Laravel /api/mediamtx/auth
# Local Docker: host.docker.internal:8000. Production: set to https://<host>/api/mediamtx/auth
authMethod: http
authHTTPAddress: http://host.docker.internal:8000/api/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof
  # Public listen (HLS/WHEP) must never challenge Basic auth in the browser.
  # Publish/WHIP still goes through authHTTPAddress.
  - action: read
  - action: playback

# Internal RTSP for ffmpeg Opus→AAC sidecar (do not expose publicly).
rtsp: true
rtspAddress: :8554
rtspEncryption: "no"

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
# TCP ICE fallback when UDP 8189 is blocked (home/CGNAT). Compose already maps 8189/tcp.
webrtcLocalTCPAddress: :8189
# Docker advertises bridge IPs if true — break ICE from browsers. Prefer false + public hosts.
webrtcIPsFromInterfaces: false
# Local: leave empty. Production Azure VM: list public IP and hostname.
webrtcAdditionalHosts: ['soundmix.live', 'www.soundmix.live', '20.120.113.129']

hls: true
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins: ['*']
# Stable fMP4 for Opus (LL-HLS parts can stutter on audio-only).
hlsVariant: fmp4
hlsSegmentCount: 5
hlsSegmentDuration: 4s
# Remux as-is into fMP4; AAC sidecar re-encodes for browser/CDN listen.
hlsAlwaysRemux: true

# OBS / ffmpeg ingest (publish auth via Laravel HTTP callback + stream_key)
rtmp: true
rtmpAddress: :1935
rtmpEncryption: "no"

pathDefaults:
  source: publisher
  overridePublisher: true
  # Server archive for desktop + crash safety. Laravel ignores short reconnect junk.
  record: true
  recordFormat: fmp4
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordPartDuration: 1s
  recordSegmentDuration: 4h
  recordDeleteAfter: 8760h

paths:
  # Primary WHIP / RTMP publish path.
  '~^live/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$':
    source: publisher
    runOnReady: sh /hooks/run-ready.sh
    runOnReadyRestart: yes
    runOnNotReady: sh /hooks/run-not-ready.sh
    runOnRecordSegmentComplete: sh /hooks/run-record-segment-complete.sh
  # Browser-safe AAC HLS for CDN / mass listen (fed by ffmpeg from primary).
  '~^live/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/aac$':
    source: publisher
    record: false
